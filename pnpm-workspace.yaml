packages:
  - packages/*
  - packages/adapters/*

catalog:
  "@ai-sdk/anthropic": ^4.0.71
  "@ai-sdk/google": ^4.0.87
  "@ai-sdk/mcp": ^2.0.66
  "@ai-sdk/openai": ^4.0.83
  "@ai-sdk/openai-compatible": ^3.0.62
  "@ai-sdk/provider": ^4.0.21
  "@types/node": ^22.15.0
  "@vitest/coverage-v8": ^5.0.3
  ai: ^7.0.127
  ai-sdk-ollama: ^4.4.0
  axe-core: ^4.13.0
  commander: ^15.0.0
  typescript: ~6.0.3
  vitest: ^5.0.3
  yaml: ^2.9.1
  zod: ^4.6.5

# Security fixes for transitive dependencies (REQ-NFR-05/AC4). Review when the parent packages update.
overrides:
  # GHSA-c475-qrg2-pj4r, via webdriverio > @puppeteer/browsers > proxy-agent > get-uri; only ftp:// PAC files use it.
  basic-ftp: ^6.2.2
  # GHSA-pqg4-j6r4-53mv (critical), via appium > @appium/support, which pins shell-quote 1.10.0; 1.11+ is compatible.
  shell-quote: ^1.11.0

# @lancedb/lancedb lists its own embedding helpers as optional dependencies; QAJitsu embeds through the models layer
# (REQ-KNOW-08), and @huggingface/transformers would pull onnxruntime-node with an install script.
ignoredOptionalDependencies:
  - "@huggingface/transformers"
  - openai

auditConfig:
  ignoreGhsas:
    # extract-zip has no fixed release. It is reached only through webdriverio > @puppeteer/browsers when WebdriverIO
    # starts a local driver and downloads a browser; QAJitsu always connects to an Appium server by host and port
    # (packages/adapters/runner-mobile/src/connect.ts, checked by a test), so that code never runs.
    - GHSA-jmr9-qjv8-65gv
    - GHSA-7pqw-9j4j-h8q3
