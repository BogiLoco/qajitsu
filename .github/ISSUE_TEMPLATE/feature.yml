name: Feature request
description: Propose new behaviour. Accepted features become requirements in docs/requirements/.
labels: [feature]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: Observable behaviour, ideally as acceptance criteria.
      placeholder: |
        AC1: ...
        AC2: ...
    validations:
      required: true
  - type: input
    id: related
    attributes:
      label: Related requirements
      placeholder: REQ-ENV-03, REQ-CFG-02
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [CTX, PLAN, ENV, CFG, WS, EXEC, VER, EVD, PUB, LLM, OBS, CI, GEN, NFR]
