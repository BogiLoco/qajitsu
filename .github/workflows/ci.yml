name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # REQ-NFR-07/AC2: Linux and macOS are supported platforms; Windows is best effort (WSL).
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The web runner's unit tests drive a real Chromium.
      - run: pnpm --filter @qajitsu/cli exec playwright-core install --with-deps chromium
      - run: pnpm verify
      - run: pnpm build
      # REQ-NFR-03/AC2: API reference (TypeDoc); every export needs TSDoc.
      - run: pnpm docs
      - name: CLI smoke test
        run: |
          pnpm qajitsu --version
          pnpm qajitsu doctor || test $? -eq 3
      - uses: actions/upload-artifact@v4
        if: always() && matrix.os == 'ubuntu-latest'
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  e2e:
    name: e2e (${{ matrix.os }}, demo-shop self-test, sandboxed runner)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @qajitsu/cli exec playwright-core install --with-deps chromium
      # Docker Compose and Android emulator suites skip themselves where Docker or the SDK is missing.
      # Builds the packages, then runs every seeded bug (FAILED) and every clean ticket (PASSED). REQ-NFR-02/AC3, REQ-NFR-04/AC1.
      - run: pnpm test:e2e

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v4
