name: CI

on:
  push:
    branches: [main]
  pull_request:
  # REQ-NFR-10/AC2: every night on main, so a new runner image, Node.js patch release or security advisory shows up
  # without waiting for the next pull request.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # REQ-NFR-07/AC2: Linux and macOS are supported platforms; Windows is best effort (WSL).
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    # verify:full takes about 10 minutes on a Linux runner and 13 on macOS (2026-11); 25 leaves room for a slow day.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # REQ-NFR-05/AC4: known high vulnerabilities in the installed tree fail the build (exceptions with reasons in
      # pnpm-workspace.yaml).
      - run: pnpm audit --audit-level high
      # The web runner's unit tests drive a real Chromium.
      # The browser only: GitHub's runner images carry Chromium's system libraries, and apt on them depends on the
      # Ubuntu mirrors resolving, which failed for hours on 2026-11-11. A missing library fails the tests loudly.
      - run: pnpm --filter @qajitsu/cli exec playwright-core install chromium
      # Everything: the unit and integration tests with the coverage thresholds (REQ-NFR-02), on Linux and macOS.
      - run: pnpm verify:full
      - run: pnpm build
      # REQ-NFR-03/AC2: API reference (TypeDoc); every export needs TSDoc.
      # `pnpm docs` would run npm's built-in `docs` (open the package page in a browser), not the script.
      - run: pnpm run docs
      - name: CLI smoke test
        run: |
          pnpm qajitsu --version
          pnpm qajitsu doctor || test $? -eq 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && matrix.os == 'ubuntu-24.04'
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  e2e:
    name: e2e (${{ matrix.os }}, demo-shop self-test, sandboxed runner)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser only: GitHub's runner images carry Chromium's system libraries, and apt on them depends on the
      # Ubuntu mirrors resolving, which failed for hours on 2026-11-11. A missing library fails the tests loudly.
      - run: pnpm --filter @qajitsu/cli exec playwright-core install chromium
      # Docker Compose and Android emulator suites skip themselves where Docker or the SDK is missing.
      # Builds the packages, then runs every seeded bug (FAILED) and every clean ticket (PASSED). REQ-NFR-02/AC3, REQ-NFR-04/AC1.
      - run: pnpm test:e2e

  # REQ-GEN-15/AC5: every pull request packs the packages as the release would, inspects them, installs the CLI from
  # the tarballs with npm into an empty folder and runs it; a change that breaks the published packages fails here.
  release-check:
    name: release check (packed packages install and run)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/release-check.mjs

  # REQ-GEN-09/AC4..AC6: every pull request builds the release image from the packed packages (amd64) and runs the
  # image check: version and labels, a non-root user, no secrets, the plugins, the digest a run records, the demo.
  image:
    name: release image (build and check)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/image-context.mjs "$RUNNER_TEMP/image"
      - run: >-
          docker build -f ci/docker/Dockerfile.release --build-arg VERSION="$(node -p 'require("./packages/cli/package.json").version')"
          --build-arg REVISION="${{ github.sha }}" -t qajitsu-image-check "$RUNNER_TEMP/image"
      - run: node scripts/image-check.mjs qajitsu-image-check "$(node -p 'require("./packages/cli/package.json").version')"

  # REQ-GEN-10/AC3..AC6: the Compose stack as a user starts it, on a real engine with a real Ollama: `qajitsu stack
  # init` with this change's image (pushed to a local registry, so it has a digest) and the small preset, models
  # pulled once and checked by digest, QAJitsu run inside. Docker on every pull request, Podman every night.
  stack-docker:
    name: stack (docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      registry:
        image: registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports: ["5000:5000"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/image-context.mjs "$RUNNER_TEMP/image"
      - name: image in the local registry
        run: |
          docker build -f ci/docker/Dockerfile.release --build-arg VERSION="$(node -p 'require("./packages/cli/package.json").version')" \
            --build-arg REVISION="$GITHUB_SHA" -t localhost:5000/qajitsu:ci "$RUNNER_TEMP/image"
          docker push localhost:5000/qajitsu:ci
          echo "IMAGE=localhost:5000/qajitsu:ci@$(docker inspect --format '{{index .RepoDigests 0}}' localhost:5000/qajitsu:ci | cut -d@ -f2)" >> "$GITHUB_ENV"
      - run: node scripts/stack-smoke.mjs docker "$IMAGE"

  stack-podman:
    name: stack (podman)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      registry:
        image: registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports: ["5000:5000"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/image-context.mjs "$RUNNER_TEMP/image"
      # Podman pulls the image over plain HTTP from the job's local registry; its API socket lets `podman compose`
      # drive Podman through the docker-compose the runner image ships.
      - name: podman with the local registry
        run: |
          printf '[[registry]]\nlocation = "localhost:5000"\ninsecure = true\n' | sudo tee /etc/containers/registries.conf.d/qajitsu-ci.conf
          systemctl --user start podman.socket
          echo "DOCKER_HOST=unix://$XDG_RUNTIME_DIR/podman/podman.sock" >> "$GITHUB_ENV"
          podman --version
      - name: image in the local registry
        run: |
          podman build -f ci/docker/Dockerfile.release --build-arg VERSION="$(node -p 'require("./packages/cli/package.json").version')" \
            --build-arg REVISION="$GITHUB_SHA" -t localhost:5000/qajitsu:ci "$RUNNER_TEMP/image"
          podman push --digestfile "$RUNNER_TEMP/digest" localhost:5000/qajitsu:ci
          echo "IMAGE=localhost:5000/qajitsu:ci@$(cat "$RUNNER_TEMP/digest")" >> "$GITHUB_ENV"
      - run: node scripts/stack-smoke.mjs podman "$IMAGE"

  # REQ-NFR-14: mutation testing of the trust-critical packages, nightly and on demand, never on every pull request
  # (it runs the tests once per mutant). Each package is checked by its own unit tests, fails below its threshold
  # (stryker/<package>.config.json, only ever raised), and the reports are kept.
  mutation:
    name: mutation (${{ matrix.package }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        package: [guard, verifier, steps]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Some steps unit tests drive a page, as in the verify job.
      - run: pnpm --filter @qajitsu/cli exec playwright-core install chromium
      - run: pnpm mutation ${{ matrix.package }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mutation-${{ matrix.package }}
          path: reports/mutation/${{ matrix.package }}/
          if-no-files-found: ignore

  # REQ-NFR-06/AC2: a new contributor gets `pnpm install && pnpm verify` green in under five minutes: no caches, a
  # fresh runner, the commands from CONTRIBUTING.md. Only the Linux system libraries for Chromium are installed first.
  # `pnpm verify` runs the unit tests; the integration tests and the coverage thresholds run in the verify job.
  contributor-setup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
      - run: npx --yes playwright-core@1.63.0 install-deps chromium
      - name: pnpm install && pnpm verify (five-minute budget)
        timeout-minutes: 5
        run: pnpm install && pnpm verify

  # REQ-NFR-05/AC4: dependencies a pull request adds or changes are reviewed for vulnerabilities and licences
  # incompatible with Apache-2.0 distribution.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          deny-licenses: AGPL-1.0, AGPL-3.0, GPL-2.0, GPL-3.0, SSPL-1.0
          comment-summary-in-pr: on-failure
