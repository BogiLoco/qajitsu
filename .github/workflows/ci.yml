name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # REQ-NFR-07/AC2: Linux and macOS are supported platforms; Windows is best effort (WSL).
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # REQ-NFR-05/AC4: known high vulnerabilities in the installed tree fail the build (exceptions with reasons in
      # pnpm-workspace.yaml).
      - run: pnpm audit --audit-level high
      # The web runner's unit tests drive a real Chromium.
      - run: pnpm --filter @qajitsu/cli exec playwright-core install --with-deps chromium
      - run: pnpm verify
      - run: pnpm build
      # REQ-NFR-03/AC2: API reference (TypeDoc); every export needs TSDoc.
      # `pnpm docs` would run npm's built-in `docs` (open the package page in a browser), not the script.
      - run: pnpm run docs
      - name: CLI smoke test
        run: |
          pnpm qajitsu --version
          pnpm qajitsu doctor || test $? -eq 3
      - uses: actions/upload-artifact@v4
        if: always() && matrix.os == 'ubuntu-latest'
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  e2e:
    name: e2e (${{ matrix.os }}, demo-shop self-test, sandboxed runner)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @qajitsu/cli exec playwright-core install --with-deps chromium
      # Docker Compose and Android emulator suites skip themselves where Docker or the SDK is missing.
      # Builds the packages, then runs every seeded bug (FAILED) and every clean ticket (PASSED). REQ-NFR-02/AC3, REQ-NFR-04/AC1.
      - run: pnpm test:e2e

  # REQ-NFR-06/AC2: a new contributor gets `pnpm install && pnpm verify` green in under five minutes: no caches, a
  # fresh runner, the commands from CONTRIBUTING.md. Only the Linux system libraries for Chromium are installed first.
  contributor-setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: npx --yes playwright-core@1.63.0 install-deps chromium
      - name: pnpm install && pnpm verify (five-minute budget)
        timeout-minutes: 5
        run: pnpm install && pnpm verify

  # REQ-NFR-05/AC4: dependencies a pull request adds or changes are reviewed for vulnerabilities and licences
  # incompatible with Apache-2.0 distribution.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: AGPL-1.0, AGPL-3.0, GPL-2.0, GPL-3.0, SSPL-1.0
          comment-summary-in-pr: on-failure
