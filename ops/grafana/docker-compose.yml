# Local observability stack for QAJitsu (REQ-OBS-03, REQ-OBS-04/AC3): OpenTelemetry Collector → Tempo (traces),
# Loki (logs), Prometheus (metrics) → Grafana with the QAJitsu dashboard. Ports listen on localhost only.
#   docker compose -f ops/grafana/docker-compose.yml up -d
#   .qa/qa.project.yaml: telemetry: { otlp: { endpoint: http://127.0.0.1:4318 } }
#   Grafana: http://127.0.0.1:3000 (anonymous viewer; admin/admin to edit)
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes: ["./otel-collector.yaml:/etc/otel/config.yaml:ro"]
    ports: ["127.0.0.1:4318:4318"]
    depends_on: [tempo, loki]
  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: ["./tempo.yaml:/etc/tempo.yaml:ro"]
  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes: ["./loki.yaml:/etc/loki/config.yaml:ro"]
  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-remote-write-receiver"]
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]
  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus, loki, tempo]
