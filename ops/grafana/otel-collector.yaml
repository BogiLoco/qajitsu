receivers:
  otlp:
    protocols:
      http: { endpoint: 0.0.0.0:4318 }
processors:
  batch: {}
  # QAJitsu sends delta sums per export; Prometheus wants cumulative ones.
  deltatocumulative: {}
exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls: { insecure: true }
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    resource_to_telemetry_conversion: { enabled: true }
    add_metric_suffixes: false
service:
  pipelines:
    traces: { receivers: [otlp], processors: [batch], exporters: [otlp/tempo] }
    logs: { receivers: [otlp], processors: [batch], exporters: [otlphttp/loki] }
    metrics: { receivers: [otlp], processors: [deltatocumulative, batch], exporters: [prometheusremotewrite] }
