# demo-shop for `qj run --build` (stage 6). QAJitsu adds an overlay with a dynamic localhost port, the
# qajitsu.* labels and an env file generated from the `services` section of .qa/qa.project.yaml
# (password from the secret provider, bug flags as overridable values). No fixed host port here, so
# parallel runs never clash; for a manual start use: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  api:
    image: node:22-alpine
    working_dir: /app
    command: ["node", "api/server.mjs", "--port", "3000", "--host", "0.0.0.0"]
    volumes:
      - ./api:/app/api:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 2s
      retries: 15
