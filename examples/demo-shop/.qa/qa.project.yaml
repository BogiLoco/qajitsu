# QAJitsu configuration for the fictional demo-shop (REQ-NFR-04).
project: demo-shop

jira:
  # Fictional tickets are read from files, so the demo runs without a Jira account.
  type: file
  tickets_dir: ../tickets
  project_key: DEMO

code_hosts:
  # Local git repositories, created by `node examples/demo-shop/scripts/setup-demo-repo.mjs`,
  # so the demo needs no GitHub account. Real projects use github or gitlab hosts.
  local:
    type: local
    root: ~/.qa-demo/git

repos:
  shop:
    host: local
    path: demo-org/demo-shop
    # API responses are validated against this contract from the analysed version (REQ-EXEC-04/AC2).
    openapi: api/openapi.yaml

environments:
  default: local
  version_endpoint: /health/version
  allowlist:
    - http://localhost:3000
    - http://localhost:5173

models:
  providers:
    # Local model through Ollama, so the demo needs no API key. Capabilities as reported by
    # `ollama show gemma4:e2b` (131072 context, tools, vision); 65536 is the context QAJitsu uses.
    local:
      type: ollama
      base_url: http://localhost:11434
      models:
        gemma4:e2b: { tools: true, structured_output: true, vision: true, context_window: 65536 }
  roles:
    default: local/gemma4:e2b

test_types: [api, web, mobile]

# `qj run DEMO-1 --build` (stage 6): the API is built from the fetched worktree of `shop` with Docker Compose.
services:
  api:
    kind: compose
    port: 3000
    env:
      DEMO_USER_PASSWORD: { secret: secret://env/DEMO_USER_PASSWORD }
      # Seeded bugs (BUGS.md), switched on for one run with: --set api.BUG_CART_TOTAL_ROUNDING=1
      BUG_CART_TOTAL_ROUNDING: { value: "0", overridable: true }
      BUG_ORDER_ACCEPTS_NEGATIVE_QTY: { value: "0", overridable: true }
      BUG_AUTH_EXPIRED_TOKEN_OK: { value: "0", overridable: true }
      BUG_DISCOUNT_STACKS: { value: "0", overridable: true }
      BUG_CHECKOUT_BUTTON_DISABLED: { value: "0", overridable: true }
      BUG_PRICE_FORMAT_LOCALE: { value: "0", overridable: true }
      BUG_SILENT_500_TOAST: { value: "0", overridable: true }
    health: { http: /health, timeout_s: 180 }

build:
  repo: shop
  compose_file: docker-compose.yml
  base_service: api
  profile: local
  seed: hooks/seed.mjs

cleanup:
  policy: on_success
  keep_last: 10
  max_age_days: 30

# Stage 8: the Android app (DEMO-6) is built from the worktree and tested on an emulator QAJitsu starts.
# Needs a JDK, the Android SDK (emulator, platforms;android-34, build-tools;34.0.0, the system image below)
# and Appium with the uiautomator2 driver (see docs/guides/mobile.md).
mobile:
  recording: retain-on-failure
  # Appium installed in the QAJitsu repository (pnpm install) with its drivers in .appium/.
  appium: { bin: ../../../node_modules/.bin/appium, home: ../../../.appium }
  android:
    app:
      { source: build, repo: shop, command: [node, android/build.mjs], output: android/build/demo-shop.apk }
    app_id: dev.qajitsu.demoshop
    activity: .CartActivity
    deep_link_scheme: demoshop
    intent_args: "--es api_url {{base_url}}"
    emulator:
      { avd: qajitsu-demo, system_image: "system-images;android-34;google_apis;arm64-v8a", headless: true }
