openapi: 3.0.3
info: { title: demo-shop API, version: "1.0.0" }
# Every operation needs a logged-in user (bearer token from POST /auth/login) except /health and /auth/login.
security: [{ bearer: [] }]
paths:
  /health:
    get:
      security: []
      responses:
        "200":
          {
            description: ok,
            content:
              {
                application/json:
                  { schema: { type: object, required: [status], properties: { status: { type: string } } } },
              },
          }
  /auth/login:
    post:
      security: []
      requestBody:
        content:
          application/json:
            {
              schema:
                {
                  type: object,
                  required: [username, password],
                  properties: { username: { type: string }, password: { type: string } },
                },
            }
      responses:
        "200":
          {
            description: logged in,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        required: [token, expires_at],
                        properties: { token: { type: string }, expires_at: { type: string } },
                      },
                  },
              },
          }
        "401":
          {
            description: invalid credentials,
            content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
          }
  /me:
    get:
      responses:
        "200":
          {
            description: user,
            content:
              {
                application/json:
                  {
                    schema:
                      { type: object, required: [username], properties: { username: { type: string } } },
                  },
              },
          }
        "401":
          {
            description: unauthorized,
            content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
          }
  /admin/seed:
    get:
      responses:
        "401":
          {
            description: unauthorized,
            content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
          }
        "200":
          {
            description: seed markers,
            content: { application/json: { schema: { $ref: "#/components/schemas/Seeds" } } },
          }
        "403":
          {
            description: not admin,
            content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
          }
    post:
      responses:
        "401":
          {
            description: unauthorized,
            content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
          }
        "201":
          {
            description: marker stored,
            content: { application/json: { schema: { $ref: "#/components/schemas/Seeds" } } },
          }
        "403":
          {
            description: not admin,
            content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
          }
        "422":
          {
            description: no marker,
            content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
          }
  /cart:
    get:
      responses:
        "200":
          {
            description: cart,
            content: { application/json: { schema: { $ref: "#/components/schemas/Cart" } } },
          }
        "401":
          {
            description: unauthorized,
            content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
          }
  /cart/lines:
    post:
      responses:
        "401":
          {
            description: unauthorized,
            content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
          }
        "201":
          {
            description: cart,
            content: { application/json: { schema: { $ref: "#/components/schemas/Cart" } } },
          }
        "404":
          {
            description: unknown product,
            content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
          }
        "422":
          {
            description: invalid quantity,
            content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
          }
  /cart/discount:
    post:
      responses:
        "401":
          {
            description: unauthorized,
            content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
          }
        "200":
          {
            description: cart,
            content: { application/json: { schema: { $ref: "#/components/schemas/Cart" } } },
          }
        "404":
          {
            description: unknown code,
            content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
          }
  /orders:
    post:
      responses:
        "401":
          {
            description: unauthorized,
            content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
          }
        "201":
          description: order
          content:
            application/json:
              schema:
                type: object
                required: [id, product_id, quantity, total]
                properties:
                  id: { type: string }
                  product_id: { type: string }
                  quantity: { type: integer, minimum: 1 }
                  total: { type: number, minimum: 0 }
        "422":
          {
            description: invalid quantity,
            content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
          }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
  schemas:
    Seeds:
      { type: object, required: [markers], properties: { markers: { type: array, items: { type: string } } } }
    Error:
      type: object
      required: [error]
      properties: { error: { type: string } }
    Cart:
      type: object
      required: [lines, discounts, subtotal, total]
      properties:
        lines:
          { type: array, items: { type: object, required: [product_id, quantity, unit_price, line_total] } }
        discounts: { type: array, maxItems: 1, items: { type: string } }
        subtotal: { type: number }
        total: { type: number }
