# QAJitsu project configuration (REQ-GEN-01). Copy to `<your-repo>/.qa/qa.project.yaml`.
# Validated by ProjectConfigSchema in @qajitsu/core: unknown keys are rejected.
# Secrets are never written here: use secret:// references (REQ-CFG-03).

project: my-service

jira:
  type: cloud # or `file` with tickets_dir for offline demos
  base_url: https://example.atlassian.net
  email: secret://env/JIRA_EMAIL
  token: secret://env/JIRA_TOKEN
  project_key: SHOP
  # Custom field holding acceptance criteria, if your Jira uses one.
  # acceptance_criteria_field: customfield_10042

# Where run folders live (REQ-WS-01). Defaults keep run data out of the repository.
# workspace:
#   root: ~/.qa-runs
#   git_cache: ~/.qa-cache/git

code_hosts:
  github:
    type: github
    token: secret://env/GITHUB_TOKEN
  gitlab:
    type: gitlab
    base_url: https://gitlab.example.com
    token: secret://env/GITLAB_TOKEN

repos:
  backend:
    host: gitlab
    path: shop/platform/backend
    default_ref: main
  web:
    host: github
    path: example-org/shop-web
  # The existing automated tests (REQ-CTX-06): checked out at default_ref on every fetch, never part of the
  # change. The planner sees their titles and lists what they already cover; the author copies their selectors.
  e2e-tests:
    host: github
    path: example-org/shop-e2e
    role: tests

# How changes are linked to a ticket (REQ-CTX-03), tried in order.
change_discovery: [jira_dev_panel, ticket_key_in_branch, ticket_key_in_title]

environments:
  default: staging
  version_endpoint: /health/version
  # Hosts agents and runners may call (REQ-ENV-01, INV-10). Production is never listed.
  allowlist:
    - https://staging.example.com
    - https://api.staging.example.com

models:
  # Providers (REQ-LLM-01/02): anthropic, openai, google, ollama, openai-compatible (LiteLLM, vLLM, LM Studio).
  providers:
    cloud:
      type: anthropic
      api_key: secret://env/ANTHROPIC_API_KEY
    local:
      type: ollama
      base_url: http://localhost:11434
      # Declare capabilities of local models after `ollama show <model>` (REQ-LLM-03).
      models:
        qwen3:32b: { tools: true, structured_output: true, context_window: 65536 }
  # Model per role: analyst, planner, author, healer, auditor, summary; `default` covers the rest.
  roles:
    default: cloud/claude-sonnet-5
    summary: local/qwen3:32b
  # token_budget: 2000000   # per run; exceeding it stops the run as BLOCKED (REQ-LLM-07)

test_types: [api, web]

# Optional sections (uncomment what you need). Full schema: schemas/qa.project.schema.json; a complete working
# example: examples/demo-shop/.qa/qa.project.yaml.
#
# `qj run --build` / `qj env up`: services built from a fetched worktree (REQ-ENV-03, REQ-CFG-02, docs/cli/build-and-runs.md)
# services:
#   api:
#     kind: compose            # compose | process | stub
#     port: 3000
#     env:
#       DB_PASSWORD: { secret: secret://env/DB_PASSWORD }
#       FEATURE_X: { value: "0", overridable: true }   # --set api.FEATURE_X=1
#     health: { http: /health, timeout_s: 180 }
# build: { repo: backend, compose_file: docker-compose.yml, base_service: api, profile: local, seed: hooks/seed.mjs }
#
# Passive observations while planned cases run (REQ-EVD-07): listed in the report and the Jira comment, never statuses.
# observations: { console: true, http_errors: true, accessibility: true, ignore: [favicon.ico, color-contrast] }

# Browser and viewport matrix (REQ-EXEC-13): web cases run in every combination, the first is the primary run.
# web:
#   matrix:
#     browsers: [chromium, firefox]
#     viewports: [{ name: desktop, width: 1280, height: 800 }, { name: mobile, width: 390, height: 844 }]

# Run budget (REQ-PLAN-08): once a limit is reached the remaining cases are NOT_RUN with the reason.
# budget: { max_minutes: 30, max_cost_usd: 2.00 }

# How cases run (REQ-EXEC-19): API, web and mobile lanes at the same time; each case holds its own pool accounts
# (accounts: { user:standard: { pool: [...] } } in envs/<name>.yaml). sequential: true runs one case at a time.
# execution:
#   workers: { api: 4, web: 2 } # default environments.workers
#   web_combinations: 1 # browser combinations of web.matrix at once
#   account_wait_s: 300
#   sequential: false

# Visual regression (REQ-EXEC-12): baselines in .qa/baselines/, accepted with `qj baseline accept`.
# visual: { threshold: 0.001, color_threshold: 0.1 }

# Locales (REQ-EXEC-14): cases that list a locale run once more in it; expected formats come from the plan.
# locales: [{ name: pl-PL, timezone: Europe/Warsaw }, { name: de-DE, timezone: Europe/Berlin }]

# Message capture (REQ-ENV-08): an inbox per case for e-mails, SMS gateways and outgoing webhooks. The host must be
# on environments.allowlist.
# messages: { base_url: https://webhook.site, email_domain: email.webhook.site, api_key: secret://env/WEBHOOKSITE_KEY, timeout_s: 120 }
# Existing manual test cases linked to tickets, imported by `qj fetch` for the planner (REQ-CTX-08):
# test_cases:
#   - { type: testrail, base_url: https://example.testrail.io, user: qa@example.com, token: secret://env/TESTRAIL_KEY, project_id: 1 }
#   - { type: xray, client_id: secret://env/XRAY_CLIENT_ID, client_secret: secret://env/XRAY_CLIENT_SECRET }
#   - { type: zephyr, token: secret://env/ZEPHYR_TOKEN }
#   - { type: file, path: testcases.csv }   # columns: id, ticket, title, preconditions, step, data, expected

# Manual steps (REQ-EXEC-11): how long a run waits for a tester's answer per step.
# manual: { timeout_s: 900 }

# Knowledge base (REQ-KNOW, ADR-0007): documents added with `qj knowledge add`, searched by the analyst and planner.
# Small documentation is used in full; above full_context_tokens retrieval is hybrid with the embedding model.
# knowledge:
#   embedding: ollama/nomic-embed-text   # <provider>/<model> from models.providers; cloud models need confirmation
#   store: lancedb                       # or chroma, with chroma: { url: secret://env/CHROMA_URL, token: ... }
#   confluence: { base_url: https://wiki.example.com, type: datacenter, token: secret://env/CONFLUENCE_TOKEN }
#                                        # for `qj knowledge add confluence:<SPACE>`; Jira Cloud sites need none
#   full_context_tokens: 20000
#   index_threshold: 50000               # chunks from which ANN and full-text indexes are built
#   max_age_days: 365                    # older documents are marked as possibly outdated in plans
#   auto_sync: false                     # sync sources before every `qj plan`
#
# Secret managers besides env (REQ-CFG-03/AC3); their own tokens come from secret://env/...
# secrets:
#   vault: { address: https://vault.example.com, mount: kv, token: secret://env/VAULT_TOKEN }   # secret://vault/ci/qajitsu#JIRA_TOKEN
#   doppler: { project: shop, config: ci, token: secret://env/DOPPLER_TOKEN }                     # secret://doppler/JIRA_TOKEN
#   op: {}                                                                                         # secret://op/QA/Jira/token
#   aws: { region: eu-central-1 }                                                                  # secret://aws/shop/ci/jira#token
#   gcp: { project: shop-qa }                                                                      # secret://gcp/jira-token
#
# Scripts from .qa/hooks/ around every run (REQ-GEN-01/AC2): setup before the cases, teardown after them
# hooks: { setup: hooks/setup.mjs, teardown: hooks/teardown.mjs, timeout_s: 120 }
#
# MCP servers the author may use to explore the app for selectors (REQ-EXEC-01); exploration is guarded and journaled,
# never test execution. Only the listed tools are offered; {{allowed_origins}} is the environment allowlist.
# mcp:
#   servers:
#     playwright:
#       command: [npx, "@playwright/mcp@0.0.41", --headless, --isolated, --allowed-origins, "{{allowed_origins}}"]
#       tools: [browser_navigate, browser_snapshot, browser_click, browser_type, browser_wait_for]
#
# Retention of runs and runtime resources (REQ-WS-03)
# cleanup: { policy: on_success, keep_last: 10, max_age_days: 30 }
#
# Auditor and canary (REQ-VER-06, REQ-VER-09)
# verification: { auditor: optional, auditor_max_images: 12, canary: false, triage: on }
#
# Plan approval flow (REQ-PLAN-10, ADR-0010): a person by default; a model step needs a model other than the planner's
# approval: { flow: [model, person], model: local/qwen3:14b, model_only: as-computed, jira: off }
#
# How much code QAJitsu may read (REQ-CTX-10): full (default), metadata (PR title, description, file names) or none
# code: { access: full }
#
# GO / NO-GO policy (REQ-PUB-10): GO only if every case PASSED; statuses of medium and low cases may be tolerated
# decision: { version: "1", tolerate: { medium: [], low: [NOT_RUN] } }
#
# Ticket readiness gate before the first plan (REQ-PLAN-13): extra risk rules over the changed paths, and when the
# result is posted to the ticket (always | not_ready | never)
# readiness: { comment: always, risk_rules: [{ pattern: "^api/payments/", level: high, reason: "payments API" }] }
#
# Prompt cache and input limits (REQ-LLM-12), inside models: { ... }:
#   cache_ttl: auto            # auto | 5m | 1h | off
#   max_input_tokens: 150000   # stop calls that would send more
#
# Time budget per stage in seconds (REQ-NFR-11): over it is a warning with the measured time, never a status.
# Defaults: fetch 300, analyze 900, plan 1200, run 3600, audit 900, triage 600, explore 3600
# timing: { budgets_s: { run: 1800 } }
#
# A person reviews generated specs before they run (REQ-VER-24): for the first runs of a new project, or always
# spec_review: { first_runs: 5, always: false }
#
# Signed test certificates (REQ-VER-15): `qj audit keygen`, then the private key in the secret provider
# certificate: { signing_key: secret://env/QAJITSU_SIGNING_KEY, required: false }
#
# Android and iOS (REQ-ENV-06, docs/guides/mobile.md)
# mobile: { recording: retain-on-failure, android: { app: { source: build, repo: app, command: [./gradlew, assembleDebug], output: app/build/outputs/apk/debug/app-debug.apk }, app_id: com.example.app } }
# Without the app's code (REQ-EXEC-23): app: { source: file, path: app.apk } | { source: url, url: https://..., sha256: <hex> } | { source: installed }
#
# Command-line tools an agent may explore in a sandbox (REQ-EXEC-24): qj explore <TICKET> --cli mytool --goal "..."
# explore: { cli: { mytool: { command: [./bin/mytool], fixture: fixtures/mytool, env: { TOKEN: { secret: secret://env/MYTOOL_TOKEN } }, allowlist: [https://staging.example.com] } } }
#
# Browser options (REQ-EXEC-05)
# web: { browser: chromium, video: retain-on-failure, headless: true, action_timeout_ms: 5000, test_id_attribute: data-testid }
#
# Jira comment and attachments (REQ-PUB-01, REQ-PUB-02, REQ-VER-10)
# publish: { max_attachment_mb: 10, auto: false, media_hosts: [media.atlassian.com] }
#
# OpenTelemetry export (REQ-OBS-03, docs/guides/observability.md)
# telemetry: { otlp: { endpoint: http://localhost:4318, service_name: qajitsu, include_details: false } }
#
# Retention of archived journals (REQ-OBS-05)
# audit: { retention_days: 365 }
